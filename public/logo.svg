<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <clipPath id="mosaic-clip">
      <rect x="640" y="110" width="180" height="175" rx="4" ry="4" />
    </clipPath>
  </defs>

  <!-- PRINT Text -->
  <g fill="#2B2B2B" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-size="205" letter-spacing="-4">
    <text x="60" y="272">PRINT</text>
  </g>

  <!-- Faceted Rainbow Mosaic Box -->
  <g clip-path="url(#mosaic-clip)">
    <!-- Base background -->
    <rect x="640" y="110" width="180" height="175" fill="#3949AB" />

    <!-- Polygons creating faceted geometric diamond spectrum -->
    <!-- Top left purple / red -->
    <polygon points="640,110 705,110 675,155" fill="#781347" />
    <polygon points="705,110 755,110 720,148" fill="#991B53" />
    <polygon points="640,110 675,155 640,175" fill="#4C145C" />
    <polygon points="640,175 675,155 660,210" fill="#6A1B9A" />

    <!-- Top right blue / violet -->
    <polygon points="755,110 820,110 785,150" fill="#1A237E" />
    <polygon points="820,110 820,175 785,150" fill="#0D47A1" />
    <polygon points="720,148 755,110 785,150 745,180" fill="#1565C0" />
    <polygon points="820,175 820,225 780,195" fill="#00838F" />

    <!-- Center facets -->
    <polygon points="675,155 720,148 745,180 700,195" fill="#C2185B" />
    <polygon points="660,210 675,155 700,195" fill="#E91E63" />
    <polygon points="700,195 745,180 780,195 735,235" fill="#0097A7" />
    <polygon points="745,180 785,150 780,195" fill="#0288D1" />

    <!-- Lower yellow / orange / green / teal -->
    <polygon points="640,175 660,210 640,250" fill="#D84315" />
    <polygon points="640,250 660,210 685,245" fill="#E64A19" />
    <polygon points="640,250 685,245 640,285 675,285" fill="#F4511E" />
    <polygon points="660,210 700,195 685,245" fill="#FF5722" />
    <polygon points="685,245 700,195 735,235 720,285" fill="#FF8F00" />
    <polygon points="675,285 685,245 720,285" fill="#FFC107" />
    <polygon points="720,285 735,235 775,285" fill="#FDD835" />
    <polygon points="735,235 780,195 800,240" fill="#009688" />
    <polygon points="735,235 800,240 775,285" fill="#43A047" />
    <polygon points="780,195 820,225 820,270 800,240" fill="#00ACC1" />
    <polygon points="800,240 820,270 820,285 775,285" fill="#2E7D32" />

    <!-- Pure White Calligraphy: خاص (Khaas) -->
    <g fill="#FFFFFF">
      <!-- Nuqta (Dot of Khay) -->
      <polygon points="792,154 804,166 792,178 780,166" />

      <!-- Sweeping long crescent bowl of the calligraphy -->
      <path d="M 748,128 C 744,138 738,154 729,168 C 720,181 710,192 696,206 C 688,214 675,225 666,229 C 656,233 648,230 651,222 C 654,216 663,207 671,199 C 683,186 695,172 708,154 C 718,141 727,125 748,128 Z" />

      <!-- Head & upper stroke of Khay -->
      <path d="M 724,152 C 735,142 748,137 762,141 C 768,143 766,151 760,156 C 748,163 735,168 724,174 C 718,167 719,158 724,152 Z" />

      <!-- Body & Loop of Swad -->
      <path d="M 708,206 C 722,197 740,190 754,197 C 761,200 759,208 751,214 C 738,223 718,230 700,233 C 693,230 700,217 708,206 Z" />

      <!-- Sweeping lower descent tail -->
      <path d="M 706,231 C 708,237 706,245 701,253 C 692,267 675,279 654,285 C 636,290 622,284 627,268 C 632,253 648,238 664,227 C 673,220 682,222 680,231 C 669,240 653,252 649,261 C 646,267 652,270 660,268 C 674,263 688,252 695,239 C 699,231 701,222 706,231 Z" />
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="305" x2="820" y2="305" stroke="#5A5B5E" stroke-width="3" stroke-linecap="round" />

  <!-- Subtitle: Printkhaas.com -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="600" font-size="52" letter-spacing="1">
    <text x="245" y="365" fill="#2B2B2B">Print</text>
    <text x="370" y="365" fill="#D32F2F" font-weight="800">k</text>
    <text x="398" y="365" fill="#F57C00" font-weight="800">h</text>
    <text x="432" y="365" fill="#00ACC1" font-weight="800">a</text>
    <text x="463" y="365" fill="#1976D2" font-weight="800">a</text>
    <text x="495" y="365" fill="#7B1FA2" font-weight="800">s</text>
    <text x="519" y="365" fill="#2B2B2B">.com</text>
  </g>
</svg>